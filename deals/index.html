<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Game Deals — GGBridge</title>
  <meta name="description" content="Game deals and gift cards from GGBridge: digital game codes, PSN, Xbox and Nintendo cards and Game Pass for Nigerian gamers, priced in naira." />
  <meta property="og:title" content="GGBridge Game Deals" />
  <meta property="og:description" content="Digital game codes and gift cards for Nigerian gamers, priced in naira. Stack games, not bills." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0a0a12" />
  <link rel="icon" href="/image/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #7b2fff; --blue: #2f8bff; --dark: #0a0a12; --card: #12121e; --card-2: #181828; --border: #1e1e32;
      --text: #e8e8f0; --muted: #8888aa; --green: #00e87a; --orange: #ff6b2f;
      --grad: linear-gradient(135deg, var(--purple), var(--blue));
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { background: var(--dark); color: var(--text); font: 15px/1.5 "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    header.top { position: sticky; top: 0; z-index: 10; background: rgba(10,10,18,.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    header.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
    .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
    .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font: inherit; font-weight: 600; border-radius: 12px; padding: 10px 16px; }
    .btn.grad { background: var(--grad); color: #fff; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.wa { background: #1fae5b; color: #fff; width: 100%; }
    .btn.wa:hover, .btn.grad:hover { filter: brightness(1.08); }

    .hero { padding: 36px 0 18px; }
    .hero h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.03em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--muted); margin: 0; max-width: 620px; }
    .updated { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.old { background: var(--orange); box-shadow: none; }

    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 18px 0 12px; }
    .search { position: relative; }
    .search input { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 16px; padding: 0 16px 0 44px; outline: none; }
    .search input:focus { border-color: var(--purple); }
    .search svg { position: absolute; left: 15px; top: 15px; opacity: .6; }
    select { height: 50px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; padding: 0 14px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .chip.on { color: #fff; border-color: transparent; background: var(--grad); }

    .notice { border: 1px solid rgba(255,107,47,.4); background: rgba(255,107,47,.08); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 6px 0 14px; }
    .count { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding-bottom: 40px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; }
    .card:hover { transform: translateY(-3px); border-color: #2c2c48; }
    .art { position: relative; aspect-ratio: 16 / 9; background: var(--card-2); overflow: hidden; }
    .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .fallback { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 14px; background: radial-gradient(120% 90% at 0% 0%, rgba(123,47,255,.55), transparent 60%), radial-gradient(120% 90% at 100% 100%, rgba(47,139,255,.45), transparent 60%), var(--card-2); }
    .fallback.gc { align-items: center; justify-content: center; text-align: center; }
    .gc-playstation { background: linear-gradient(135deg, #003791, #0070d1); }
    .gc-xbox, .gc-gamepass { background: linear-gradient(135deg, #0b3d0b, #107c10); }
    .gc-nintendo { background: linear-gradient(135deg, #8a000b, #e60012); }
    .section { grid-column: 1 / -1; margin: 18px 0 0; font-size: 22px; letter-spacing: -0.01em; }
    .fallback b { font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
    .badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: rgba(10,10,18,.78); backdrop-filter: blur(4px); }
    .badge.off { background: var(--green); color: #04130b; }
    .badge.hot { background: var(--orange); color: #1a0800; }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .title { font-weight: 600; font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
    .plat { font-size: 12px; color: var(--muted); }
    .price { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: auto; }
    .was { font-size: 12px; color: var(--muted); }
    .was s { color: #a3a3c2; }
    .card .btn.wa { margin-top: 8px; padding: 10px; font-size: 14px; }

    .state { text-align: center; padding: 60px 16px; color: var(--muted); }
    .state h2 { color: var(--text); margin: 0 0 6px; }
    .skeleton .art, .skeleton .line { background: linear-gradient(90deg, var(--card-2), #20203a, var(--card-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
    .skeleton .line { height: 14px; border-radius: 6px; margin: 6px 0; }
    @keyframes sh { to { background-position: -200% 0; } }

    footer { border-top: 1px solid var(--border); padding: 26px 0 40px; color: var(--muted); font-size: 14px; }
    footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .body { padding: 10px; }
      .title { font-size: 14px; }
      .price { font-size: 18px; }
      .controls { grid-template-columns: minmax(0, 1fr); }
      .hero { padding-top: 24px; }
      header .btn.grad { padding: 8px 12px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { .card, .skeleton .art, .skeleton .line { transition: none; animation: none; } }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="logo" href="/"><span>GGBridge</span></a>
    <div class="spacer"></div>
    <a class="btn grad" id="waTop" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
  </div></header>

  <main class="wrap">
    <section class="hero">
      <h1>Game <em>deals</em> and gift cards, priced in naira.</h1>
      <p>Digital game codes, gift cards and Game Pass delivered to you. No foreign card, no declined payments. Stack games, not bills.</p>
      <div class="updated" id="updated" hidden><span class="dot" id="dot"></span><span id="updatedText"></span></div>
    </section>

    <div class="controls">
      <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search games and gift cards" autocomplete="off" aria-label="Search games and gift cards" /></label>
      <select id="sort" aria-label="Sort">
        <option value="popular">Most popular</option>
        <option value="discount">Biggest discount</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="new">Newest</option>
      </select>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="Filter"></div>
    <div id="notice"></div>
    <div class="count" id="count"></div>
    <div id="list" class="grid" aria-live="polite"></div>
  </main>

  <footer><div class="wrap">
    <span>© <span id="year"></span> GGBridge · Prices in naira · Digital delivery</span>
    <a class="btn ghost" id="waFoot" href="#" target="_blank" rel="noopener">Questions? WhatsApp us</a>
  </div></footer>

  <script>
  (function () {
    "use strict";
    var state = { data: null, q: "", sort: "popular", chip: "all" };
    var CHIPS = [["all", "All"], ["hot", "Hot deals"], ["new", "New releases"], ["steam", "Steam"], ["xbox", "Xbox / PC"], ["pc", "Other PC"], ["gift", "Gift cards"]];
    var GIFT_ORDER = ["playstation", "xbox", "nintendo", "gamepass"];
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var naira = function (n) { return "₦" + Math.round(n).toLocaleString("en-US"); };
    var safeUrl = function (u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; };
    $("year").textContent = new Date().getFullYear();

    function wa(text) {
      var num = state.data && /^\d{8,15}$/.test(state.data.whatsapp) ? state.data.whatsapp : "";
      return "https://wa.me/" + num + "?text=" + encodeURIComponent(text);
    }
    function setWa() {
      var t = "Hi GGBridge! I saw your game deals page and want to buy a game.";
      $("waTop").href = wa(t); $("waFoot").href = wa(t);
    }

    function matchChip(it) {
      var c = state.chip, p = it.platform.toLowerCase();
      if (c === "all") return true;
      if (c === "gift") return it.group === "giftcard";
      if (it.group === "giftcard" && c !== "hot") return false;
      if (c === "hot") return it.badges.indexOf("Hot deal") >= 0 || (it.discountPct || 0) >= 30;
      if (c === "new") return it.group === "new" || it.group === "preorder";
      if (c === "steam") return p.indexOf("steam") === 0;
      if (c === "xbox") return p.indexOf("xbox") === 0;
      if (c === "pc") return p.indexOf("steam") !== 0 && p.indexOf("xbox") !== 0;
      return true;
    }

    function visible() {
      var q = state.q.trim().toLowerCase();
      var items = state.data.items.filter(function (it) { return matchChip(it) && (!q || it.name.toLowerCase().indexOf(q) >= 0); });
      var s = state.sort;
      items.sort(function (a, b) {
        if (s === "discount") return (b.discountPct || 0) - (a.discountPct || 0);
        if (s === "low") return a.price - b.price;
        if (s === "high") return b.price - a.price;
        if (s === "new") return String(b.releaseDate || "").localeCompare(String(a.releaseDate || ""));
        if (a.group === "giftcard" && b.group === "giftcard") return GIFT_ORDER.indexOf(a.brand) - GIFT_ORDER.indexOf(b.brand) || (/\(UK\)$/.test(a.name) ? 1 : 0) - (/\(UK\)$/.test(b.name) ? 1 : 0) || a.price - b.price;
        return (a.popularity == null ? 9999 : a.popularity) - (b.popularity == null ? 9999 : b.popularity);
      });
      return items;
    }

    function card(it) {
      var imgs = (it.images || (it.image ? [it.image] : [])).map(safeUrl).filter(Boolean);
      var img = imgs[0];
      var badges = "";
      if (it.discountPct) badges += '<span class="badge off">-' + it.discountPct + "%</span>";
      it.badges.forEach(function (b) { badges += '<span class="badge ' + (b === "Hot deal" ? "hot" : "") + '">' + esc(b) + "</span>"; });
      var msg = "Hi GGBridge! I want " + it.name + " (" + it.platform + ") at " + naira(it.price) + ". Deal code " + it.code + ".";
      return '<article class="card">' +
        '<div class="art">' +
          (it.group === "giftcard"
            ? '<div class="fallback gc gc-' + esc(it.brand || "other") + '"><b>' + esc(it.name) + "</b></div>"
            : '<div class="fallback"><b>' + esc(it.name) + "</b></div>") +
          (img ? '<img src="' + esc(img) + '" alt="' + esc(it.name) + ' cover art" loading="lazy" decoding="async" width="616" height="353" data-fallback="' + esc(imgs.slice(1).join(" ")) + '" />' : "") +
          '<div class="badges">' + badges + "</div>" +
        "</div>" +
        '<div class="body">' +
          '<div class="title">' + esc(it.name) + "</div>" +
          '<div class="plat">' + esc(it.platform) + "</div>" +
          '<div class="price">' + naira(it.price) + "</div>" +
          (it.was ? '<div class="was"><s>' + naira(it.was.price) + "</s> " + esc(it.was.label) + "</div>" : "") +
          '<a class="btn wa" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">Buy on WhatsApp</a>' +
        "</div></article>";
    }

    function render() {
      var d = state.data;
      var items = visible();
      $("count").textContent = items.length + " of " + d.items.length + " deals";
      $("list").className = "grid";
      var games = items.filter(function (it) { return it.group !== "giftcard"; });
      var gifts = items.filter(function (it) { return it.group === "giftcard"; });
      $("list").innerHTML = items.length ? games.map(card).join("") +
        (gifts.length && games.length ? '<h2 class="section">Gift cards &amp; subscriptions</h2>' : "") + gifts.map(card).join("") :
        '<div class="state" style="grid-column:1/-1"><h2>No games match</h2><p>Try another search, or ask us on WhatsApp: we can quote games that aren’t listed.</p></div>';
      // The branded title tile sits under every image, so a slow or broken image shows the game's name, never a broken icon.
      Array.prototype.forEach.call($("list").querySelectorAll("img[data-fallback]"), function (im) {
        // On error, try the next picture (official Steam art, then Microsoft, then others); none left → the tile.
        im.addEventListener("error", function next() {
          var rest = (im.getAttribute("data-fallback") || "").split(" ").filter(Boolean);
          if (!rest.length) { im.remove(); return; }
          im.setAttribute("data-fallback", rest.slice(1).join(" "));
          im.src = rest[0];
        });
        if (im.complete && im.naturalWidth === 0 && im.currentSrc) im.dispatchEvent(new Event("error"));
      });
    }

    function renderChips() {
      $("chips").innerHTML = CHIPS.map(function (c) {
        return '<button class="chip ' + (state.chip === c[0] ? "on" : "") + '" data-chip="' + c[0] + '" role="tab" aria-selected="' + (state.chip === c[0]) + '">' + c[1] + "</button>";
      }).join("");
      Array.prototype.forEach.call($("chips").querySelectorAll("[data-chip]"), function (b) {
        b.addEventListener("click", function () { state.chip = b.getAttribute("data-chip"); renderChips(); render(); });
      });
    }

    function showUpdated() {
      var d = state.data;
      var at = new Date(d.publishedAt), exp = new Date(d.expiresAt);
      $("updated").hidden = false;
      $("updatedText").textContent = "Prices updated " + at.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      if (Date.now() > exp.getTime()) {
        $("dot").className = "dot old";
        $("notice").innerHTML = '<div class="notice">These prices were set on ' + esc(at.toLocaleDateString("en-GB", { day: "numeric", month: "long" })) + " and may have changed. Message us on WhatsApp to confirm before paying.</div>";
      }
    }

    function skeleton() {
      var s = "";
      for (var i = 0; i < 8; i++) s += '<article class="card skeleton"><div class="art"></div><div class="body"><div class="line" style="width:80%"></div><div class="line" style="width:40%"></div><div class="line" style="width:55%;height:22px"></div></div></article>';
      $("list").innerHTML = s;
    }

    function fail() {
      setWa();
      $("list").innerHTML = '<div class="state" style="grid-column:1/-1"><h2>Deals couldn’t load</h2><p>Check your connection and refresh, or message us: we’ll send today’s prices.</p><p><a class="btn grad" href="' + esc(wa("Hi GGBridge! Please send me today's game deals.")) + '" target="_blank" rel="noopener">WhatsApp us</a></p></div>';
    }

    skeleton(); renderChips();
    $("q").addEventListener("input", function (e) { state.q = e.target.value; if (state.data) render(); });
    $("sort").addEventListener("change", function (e) { state.sort = e.target.value; if (state.data) render(); });

    fetch("deals.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (!d || d.version !== 1 || !Array.isArray(d.items)) throw new Error("bad data");
        // Defensive: drop anything malformed rather than show a broken card.
        d.items = d.items.filter(function (it) { return it && typeof it.name === "string" && typeof it.price === "number" && it.price > 0 && typeof it.code === "string"; })
          .map(function (it) { it.badges = Array.isArray(it.badges) ? it.badges : []; it.platform = String(it.platform || "Digital code"); return it; });
        state.data = d; setWa(); showUpdated(); render();
      })
      .catch(fail);
  })();
  </script>
</body>
</html>
